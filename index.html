<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Glass effect</title>
    <link rel="stylesheet" href="./assets/styles/reset.css" />
    <link rel="stylesheet" href="./assets/styles/style.css" />
  </head>
  <body>
    <img src="./assets/images/icon_1.png" alt="decoration" class="icon_1" />
    <img src="./assets/images/icon_2.png" alt="decoration" class="icon_2" />
    <img src="./assets/images/icon_3.png" alt="decoration" class="icon_3" />
    <img src="./assets/images/icon_4.png" alt="decoration" class="icon_4" />
    <img src="./assets/images/icon_5.png" alt="decoration" class="icon_5" />
    <img src="./assets/images/icon_6.png" alt="decoration" class="icon_6" />
    <img src="./assets/images/icon_7.png" alt="decoration" class="icon_7" />
    <img src="./assets/images/icon_8.png" alt="decoration" class="icon_8" />
    <img src="./assets/images/icon_9.png" alt="decoration" class="icon_9" />
    <img src="./assets/images/icon_10.png" alt="decoration" class="icon_10" />
    <section class="hero">
      <div class="login">
        <h2 class="logo">Your logo</h2>
        <div class="signin">
          <form action="login">
            <h3 class="form-head">Login</h3>
            <label for="email">Email</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="username@gmail.com"
            />
            <label for="password">Password</label>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Password"
            />
            <h4><a href="">Forgot Password?</a></h4>
            <button class="btn">Sing in</button>
            <h5 class="continue">or continue with</h5>
            <div class="social-btns">
              <div></div>
              <div></div>
              <div></div>
            </div>
            <h6>Don’t have an account yet? <span>Register for free</span></h6>
          </form>
        </div>
      </div>
    </section>
  </body>
</html>
